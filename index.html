<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/shared/images/logo.png" />
  <!-- "Adicionar à Tela de Início": no iOS, sem o apple-touch-icon o ícone vira uma captura da página -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Notas FESA" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notas FESA</title>
  <!-- aplica o tema antes da primeira pintura para não piscar branco no modo escuro -->
  <script>
    (function () {
      var tema;
      try { tema = localStorage.getItem("tema"); } catch (e) { }
      if (tema !== "light" && tema !== "dark") tema = "light";
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
  <style>
    html[data-theme="dark"] { background-color: #121417; color-scheme: dark; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
